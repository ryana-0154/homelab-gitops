apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: homelab-ca
  secretName: homelab-ca-tls
  duration: 87600h    # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca
spec:
  ca:
    secretName: homelab-ca-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-wildcard
  namespace: envoy-gateway-system
spec:
  secretName: homelab-wildcard-tls
  duration: 8760h     # 1 year
  renewBefore: 720h   # 30 days
  commonName: "*.homelab.lan"
  dnsNames:
    - "*.homelab.lan"
    - "homelab.lan"
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
    group: cert-manager.io
