# HTTPS — terminates TLS with the default wildcard cert (TLSStore "default")
# and forwards to the pihole web UI. Pi-hole's own server redirects / to /admin.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole
  namespace: pihole
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pihole.homelab.lan`)
      kind: Rule
      services:
        - name: pihole-web
          port: 80
  tls: {}
---
# HTTP — redirect to HTTPS.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole-redirect
  namespace: pihole
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pihole.homelab.lan`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: kube-system
      services:
        - name: pihole-web
          port: 80
