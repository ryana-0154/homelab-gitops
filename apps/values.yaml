apps:
  - name: podinfo
    repoUrl: https://github.com/stefanprodan/podinfo
    branch: master
    path: kustomize
    namespace: podinfo

  - name: sealed-secrets
    repoUrl: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    version: 2.16.1
    namespace: sealed-secrets
    values: |
      fullnameOverride: sealed-secrets-controller

  - name: pihole
    repoUrl: https://github.com/ryana-0154/pihole-helm
    branch: main
    path: .
    namespace: pihole
    values: |
      existingSecret: pihole-admin

  - name: envoy-gateway
    repoUrl: docker.io/envoyproxy
    chart: gateway-helm
    version: v1.4.0
    namespace: envoy-gateway-system

  - name: cert-manager
    repoUrl: https://charts.jetstack.io
    chart: cert-manager
    version: v1.16.2
    namespace: cert-manager
    values: |
      crds:
        enabled: true

  - name: cert-manager-issuers
    repoUrl: https://github.com/ryana-0154/homelab-gitops
    branch: main
    path: certs
    namespace: cert-manager

  - name: gateway-resources
    repoUrl: https://github.com/ryana-0154/homelab-gitops
    branch: main
    path: gateway
    namespace: envoy-gateway-system

  - name: monitoring-secrets
    repoUrl: https://github.com/ryana-0154/homelab-gitops
    branch: main
    path: secrets/monitoring
    namespace: monitoring

  - name: monitoring
    repoUrl: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    version: 4.1.1
    namespace: monitoring
    values: |
      cluster:
        name: homelab

      destinations:
        grafana-cloud-metrics:
          type: prometheus
          url: https://prometheus-prod-55-prod-gb-south-1.grafana.net/api/prom
          auth:
            type: basic
            usernameKey: metrics-username
            passwordKey: password
          secret:
            create: false
            name: grafana-cloud-credentials
            namespace: monitoring

        grafana-cloud-logs:
          type: loki
          url: https://logs-prod-035.grafana.net
          auth:
            type: basic
            usernameKey: logs-username
            passwordKey: password
          secret:
            create: false
            name: grafana-cloud-credentials
            namespace: monitoring

      clusterMetrics:
        enabled: true
        collector: alloy-metrics

      telemetryServices:
        kube-state-metrics:
          deploy: true

      clusterEvents:
        enabled: true
        collector: alloy-metrics

      podLogsViaLoki:
        enabled: true
        collector: alloy-logs

      annotationAutodiscovery:
        enabled: true
        collector: alloy-metrics

      collectors:
        alloy-metrics:
          presets: [clustered, statefulset]
        alloy-singleton:
          enabled: true
        alloy-logs:
          presets: [filesystem-log-reader, daemonset]
